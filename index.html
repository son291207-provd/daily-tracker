<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơn's Tracker - Quản Lý Cá Nhân</title>
    <!-- Thêm Google Font để đổi kiểu chữ nhận diện -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ĐỊNH NGHĨA MÀU SẮC THƯƠNG HIỆU (BRAND COLORS) */
            --primary-color: #2563eb; /* Xanh dương chủ đạo */
            --accent-color: #f59e0b;  /* Màu điểm nhấn (cam vàng) */
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; /* Font chữ nhận diện thương hiệu */
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            padding: 20px; 
        }
        
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
        }

        /* KHU VỰC LOGO & TIÊU ĐỀ THƯƠNG HIỆU */
        .brand-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .brand-logo {
            width: 60px;
            height: 60px;
            background: var(--primary-color);
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 10px auto;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }
        h1 { font-size: 22px; color: var(--primary-color); margin: 0; }
        .real-time { text-align: center; color: #64748b; font-size: 13px; margin-top: 5px; }

        .section-title { font-size: 16px; color: var(--primary-color); margin-top: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; font-weight: 700; }
        
        .task-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .task-left { display: flex; align-items: center; gap: 12px; }
        .task-time { font-weight: 600; color: var(--accent-color); font-size: 13px; min-width: 90px; }
        .completed { text-decoration: line-through; color: #94a3b8; }
        
        .timekeeping-box { background: #eff6ff; border: 1px solid #bfdbfe; padding: 15px; border-radius: 12px; margin-top: 20px; text-align: center; }
        .btn { background: var(--primary-color); color: white; border: none; padding: 12px 24px; font-size: 15px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .btn:hover { opacity: 0.9; }
        #log-status { margin-top: 10px; font-size: 14px; color: #1e40af; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <!-- KHỐI NHẬN DIỆN THƯƠNG HIỆU -->
    <div class="brand-header">
        <div class="brand-logo">S</div> <!-- Chữ cái đại diện thương hiệu hoặc thay bằng thẻ hình ảnh logo -->
        <h1>SƠN'S DAILY TRACKER</h1>
        <div class="real-time" id="live-clock">Đang tải đồng hồ thời gian thực...</div>
    </div>

    <!-- KHU VỰC CHẤM CÔNG -->
    <div class="timekeeping-box">
        <h3>⏱️ Chấm Công Ngày Làm Việc</h3>
        <button id="checkin-btn" class="btn" onclick="performCheckIn()">CHECK-IN (Chấm công vào)</button>
        <div id="log-status">Chưa chấm công hôm nay.</div>
    </div>

    <!-- TO-DO LIST THEO THỜI GIAN -->
    <div class="section-title">📋 Lịch Trình & Mục Tiêu</div>
    <div id="task-list"></div>
</div>

<script>
    function updateClock() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
        document.getElementById('live-clock').innerText = now.toLocaleDateString('vi-VN', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    const tasks = [
        { time: "05:00 - 06:30", text: "Vận động ngoài trời + Thoa kem chống nắng", done: false },
        { time: "06:30 - 07:00", text: "Vệ sinh cá nhân + Bữa sáng (Trứng, khoai lang, chuối)", done: false },
        { time: "12:00 - 13:00", text: "Bữa trưa (Ức gà, khoai, rau xanh)", done: false },
        { time: "13:00 - 16:30", text: "Học tập chuyên ngành tại Đại học Bách Khoa", done: false },
        { time: "16:30 - 17:00", text: "Bữa phụ (Sữa hạt Vinamilk)", done: false },
        { time: "17:00 - 18:30", text: "Tập kháng lực tại nhà (Theo Google Calendar)", done: false },
        { time: "19:00 - 19:30", text: "Bữa tối phục hồi (Ức gà, khoai, nhiều rau)", done: false },
        { time: "22:30 - 23:00", text: "Skincare tối + Ngủ trước 23:00", done: false }
    ];

    function renderTasks() {
        const listContainer = document.getElementById('task-list');
        listContainer.innerHTML = '';
        tasks.forEach((task, index) => {
            listContainer.innerHTML += `
                <div class="task-item">
                    <div class="task-left">
                        <input type="checkbox" ${task.done ? 'checked' : ''} onclick="toggleTask(${index})">
                        <span class="task-time">[${task.time}]</span>
                        <span id="task-text-${index}" class="${task.done ? 'completed' : ''}">${task.text}</span>
                    </div>
                </div>
            `;
        });
    }

    function toggleTask(index) {
        tasks[index].done = !tasks[index].done;
        renderTasks();
    }

    function performCheckIn() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('vi-VN') + " - " + now.toLocaleDateString('vi-VN');
        localStorage.setItem('lastCheckIn', timeString);
        document.getElementById('log-status').innerText = "✅ Đã chấm công thành công lúc: " + timeString;
    }

    window.onload = function() {
        renderTasks();
        const savedLog = localStorage.getItem('lastCheckIn');
        if (savedLog) {
            document.getElementById('log-status').innerText = "✅ Đã chấm công gần nhất: " + savedLog;
        }
    }
</script>

</body>
</html>
