<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tracker & Chấm Công - Sơn</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; margin-bottom: 5px; }
        .real-time { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
        .section-title { font-size: 18px; color: #2980b9; margin-top: 20px; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; }
        .task-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f1f1; }
        .task-left { display: flex; align-items: center; gap: 10px; }
        .task-time { font-weight: bold; color: #e67e22; font-size: 13px; min-width: 90px; }
        .completed { text-decoration: line-through; color: #95a5a6; }
        .timekeeping-box { background: #e8f8f5; border: 1px solid #a3e4d7; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; }
        .btn { background: #1abc9c; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: #16a085; }
        .btn-checked { background: #95a5a6; cursor: not-allowed; }
        #log-status { margin-top: 10px; font-size: 14px; color: #16a085; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎯 Lịch Trình & Chấm Công Ngày</h1>
    <div class="real-time" id="live-clock">Đang tải đồng hồ thời gian thực...</div>

    <!-- KHU VỰC CHẤM CÔNG -->
    <div class="timekeeping-box">
        <h3>⏱️ Khu Vực Chấm Công Hàng Ngày</h3>
        <button id="checkin-btn" class="btn" onclick="performCheckIn()">CHECK-IN (Chấm công vào)</button>
        <div id="log-status">Chưa chấm công hôm nay.</div>
    </div>

    <!-- TO-DO LIST THEO THỜI GIAN -->
    <div class="section-title">📋 To-Do List Theo Khung Giờ</div>
    <div id="task-list">
        <!-- Danh sách nhiệm vụ sẽ tự động load ở đây -->
    </div>
</div>

<script>
    // 1. Đồng hồ thời gian thực
    function updateClock() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
        document.getElementById('live-clock').innerText = now.toLocaleDateString('vi-VN', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Dữ liệu Task mẫu theo đúng routine của Sơn
    const tasks = [
        { time: "05:00 - 06:30", text: "Vận động ngoài trời + Thoa kem chống nắng", done: false },
        { time: "06:30 - 07:00", text: "Vệ sinh cá nhân + Bữa sáng (Trứng, khoai lang, chuối)", done: false },
        { time: "12:00 - 13:00", text: "Bữa trưa (Ức gà, khoai, rau xanh)", done: false },
        { time: "13:00 - 16:30", text: "Học tập chuyên ngành tại Đại học Bách Khoa", done: false },
        { time: "16:30 - 17:00", text: "Bữa phụ (Sữa hạt Vinamilk)", done: false },
        { time: "17:00 - 18:30", text: "Tập kháng lực tại nhà (Theo Google Calendar)", done: false },
        { time: "19:00 - 19:30", text: "Bữa tối phục hồi (Ức gà, khoai, nhiều rau)", done: false },
        { time: "22:30 - 23:00", text: "Skincare tối + Ngủ trước 23:00", done: false }
    ];

    function renderTasks() {
        const listContainer = document.getElementById('task-list');
        listContainer.innerHTML = '';
        tasks.forEach((task, index) => {
            listContainer.innerHTML += `
                <div class="task-item">
                    <div class="task-left">
                        <input type="checkbox" ${task.done ? 'checked' : ''} onclick="toggleTask(${index})">
                        <span class="task-time">[${task.time}]</span>
                        <span id="task-text-${index}" class="${task.done ? 'completed' : ''}">${task.text}</span>
                    </div>
                </div>
            `;
        });
    }

    function toggleTask(index) {
        tasks[index].done = !tasks[index].done;
        renderTasks();
    }

    // 3. Tính năng Chấm công (Lưu thời gian thực tế vào LocalStorage)
    function performCheckIn() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('vi-VN') + " - " + now.toLocaleDateString('vi-VN');
        localStorage.setItem('lastCheckIn', timeString);
        document.getElementById('log-status').innerText = "✅ Đã chấm công thành công lúc: " + timeString;
    }

    window.onload = function() {
        renderTasks();
        const savedLog = localStorage.getItem('lastCheckIn');
        if (savedLog) {
            document.getElementById('log-status').innerText = "✅ Đã chấm công gần nhất: " + savedLog;
        }
    }
</script>

</body>
</html>
